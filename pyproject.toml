[build-system]
requires = ["setuptools>=65.0"]
build-backend = "setuptools.build_meta"

[project]
name = "credit_risk_scoring_system"
version = "0.1.0"
description = "Streamlit credit risk scoring system with explainability and model evaluation."
authors = [
  { name = "Anurag Patel" }
]
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }

dependencies = [
  "streamlit>=1.37.0",
  "pandas>=2.2.2",
  "numpy>=1.26.0",
  "scipy>=1.16.0",
  "scikit-learn>=1.7.0",
  "xgboost>=2.1.0",
  "shap>=0.46.0",
  "altair>=5.3.0",
  "matplotlib>=3.8.0",
  "joblib>=1.3.0",
  "pytest>=8.0.0",
]

[project.urls]
Source = "https://github.com/anurag004-12/Credit-Risk-Scoring-System"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["tests*"]
